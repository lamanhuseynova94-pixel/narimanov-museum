<div class="letter">
<p><strong>TBMM Sədrliyinə,</strong></p>
<p>“İmperializmə qarşı qazandığı bu böyük qələbələrə görə, qardaş türk xalqını, TBMM-ni və onun rəhbəri Mustafa Kamal Paşanı, Azərbaycan Sovet Sosialist Xalq Cümhuriyyəti və Azərbaycan xalqı adından təbrik edir və kutlayırıq.”</p>
